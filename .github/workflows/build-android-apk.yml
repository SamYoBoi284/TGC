name: Build TGC Android APK

on:
  push:
    branches:
      - main
      - "feat/native-android-apk-github-actions"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true'

      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'

      - name: Bundle existing TGC web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.json service-worker.js android/app/src/main/assets/www/
          cp -R css js assets android/app/src/main/assets/www/

      - name: Configure native Android launcher icon
        run: |
          test -s assets/icon-512.png
          mkdir -p android/app/src/main/res/mipmap-nodpi
          cp assets/icon-512.png android/app/src/main/res/mipmap-nodpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-nodpi/ic_launcher.png

      - name: Prepare stable Android signing key (required for release builds)
        env:
          TGC_ANDROID_KEYSTORE_BASE64: ${{ secrets.TGC_ANDROID_KEYSTORE_BASE64 }}
          TGC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TGC_ANDROID_KEYSTORE_PASSWORD }}
          TGC_ANDROID_KEY_ALIAS: ${{ secrets.TGC_ANDROID_KEY_ALIAS }}
          TGC_ANDROID_KEY_PASSWORD: ${{ secrets.TGC_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TGC_ANDROID_KEYSTORE_BASE64" || { echo "Missing TGC_ANDROID_KEYSTORE_BASE64 secret; refusing to create an incorrectly signed release APK."; exit 1; }
          test -n "$TGC_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing TGC_ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$TGC_ANDROID_KEY_ALIAS" || { echo "Missing TGC_ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$TGC_ANDROID_KEY_PASSWORD" || { echo "Missing TGC_ANDROID_KEY_PASSWORD secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/tgc-release.jks"
          printf '%s' "$TGC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "TGC_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "TGC_ANDROID_KEYSTORE_PASSWORD=$TGC_ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TGC_ANDROID_KEY_ALIAS=$TGC_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TGC_ANDROID_KEY_PASSWORD=$TGC_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build signed release APK
        env:
          TGC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.TGC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$TGC_GOOGLE_WEB_CLIENT_ID" || { echo "Missing TGC_GOOGLE_WEB_CLIENT_ID secret."; exit 1; }
          gradle --no-daemon -p android assembleRelease
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/The-Glitchcore-Chronicle.apk"
          test -s "$RUNNER_TEMP/The-Glitchcore-Chronicle.apk"

      - name: Verify signed release APK and print signing certificate fingerprints
        run: |
          APK="$RUNNER_TEMP/The-Glitchcore-Chronicle.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      # Actions artifact only: this workflow never creates a GitHub Release.
      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Glitchcore-Chronicle-Android
          path: ${{ runner.temp }}/The-Glitchcore-Chronicle.apk
          if-no-files-found: error
          retention-days: 30
