name: Publish signed TGC Android release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      TGC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TGC_ANDROID_KEYSTORE_PASSWORD }}
      TGC_ANDROID_KEY_ALIAS: ${{ secrets.TGC_ANDROID_KEY_ALIAS }}
      TGC_ANDROID_KEY_PASSWORD: ${{ secrets.TGC_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate signing secrets and prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TGC_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$TGC_ANDROID_KEYSTORE_PASSWORD" || -z "$TGC_ANDROID_KEY_ALIAS" || -z "$TGC_ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure TGC_ANDROID_KEYSTORE_BASE64, TGC_ANDROID_KEYSTORE_PASSWORD, TGC_ANDROID_KEY_ALIAS, and TGC_ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          echo "TGC_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Derive version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="${TAG#v}"
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example v0.2.0)."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          TGC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.TGC_GOOGLE_WEB_CLIENT_ID }}
        shell: bash
        run: gradle --no-daemon -p android assembleRelease

      - name: Prepare APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Expected release APK was not produced: $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" tgc-android-release.apk
          sha256sum tgc-android-release.apk > tgc-android-release.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose tgc-android-release.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "TGC $VERSION_NAME" --generate-notes
          fi
          gh release upload "$TAG" tgc-android-release.apk tgc-android-release.apk.sha256 --clobber

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f android/app/release.keystore
