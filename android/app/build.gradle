plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sam.tgc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sam.tgc'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
